# Refresh entomology feeds, then publish the static site to GitHub Pages.
# Runs daily, on every push to main, and on demand from the Actions tab.
#
# configure-pages is called with enablement: true so it will try to turn Pages
# on when the site does not exist yet. Creating a Pages site requires a token
# other than the workflow GITHUB_TOKEN (a personal access token, or a GitHub
# App with administration:write and pages:write). Until Pages exists and its
# source is GitHub Actions, the owner sets that once under
# Settings → Pages → Build and deployment → Source.

name: Refresh and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily, a few minutes past the hour so it misses the cron stampede.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress production deploy finish. Skip older queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # page_url is set only by the attempt that published. A failed attempt
      # leaves it empty, so the next successful attempt supplies the URL.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh feeds
        run: python3 fetch.py

      - name: Assemble static site
        # Only the pages the browser needs. fetch.py, the workflow, README,
        # and any previews/ or docs/ stay out of the published artifact.
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -a css js data img _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        # Artifacts belong to the run, not the attempt. A unique name lets a
        # re-run upload and deploy its own artifact instead of colliding with
        # the previous attempt's github-pages artifact.
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # deploy-pages sometimes starts before artifact metadata has propagated
      # and fails with "Found 0 artifact(s)" / no artifact named
      # github-pages-<attempt>, a few seconds after the upload succeeded.
      # Wait and deploy that same artifact again. Attempts 1 and 2 continue
      # on error so a later success can still pass the job. Attempt 3 does
      # not, so the job fails when every attempt fails.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata again
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (second retry)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
