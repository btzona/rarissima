# Refresh entomology feeds, then publish the static site to GitHub Pages.
# Runs daily, on every push to main, and on demand from the Actions tab.
#
# configure-pages is called with enablement: true so it will try to turn Pages
# on when the site does not exist yet. Creating a Pages site requires a token
# other than the workflow GITHUB_TOKEN (a personal access token, or a GitHub
# App with administration:write and pages:write). Until Pages exists and its
# source is GitHub Actions, the owner sets that once under
# Settings → Pages → Build and deployment → Source.

name: Refresh and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily, a few minutes past the hour so it misses the cron stampede.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress production deploy finish. Skip older queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh feeds
        run: python3 fetch.py

      - name: Assemble static site
        # Only the pages the browser needs. fetch.py, the workflow, README,
        # and any previews/ or docs/ stay out of the published artifact.
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -a css js data _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
